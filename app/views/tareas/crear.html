{% extends "base.html" %}

{% block titulo %}Nueva Tarea — Sistema de Tareas{% endblock %}

{% block contenido %}
<div class="card">
    <div class="card-header">
        <h1 class="card-title">Nueva Tarea</h1>
        <a href="{{ url_for('tareas.lista') }}" class="btn btn-secundario">&#8592; Volver</a>
    </div>

    <form method="POST" action="{{ url_for('tareas.crear') }}" novalidate>

        <div class="form-group">
            <label for="titulo" class="form-label">
                Título <span class="requerido">*</span>
            </label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                class="form-control"
                value="{{ titulo }}"
                placeholder="Ej: Revisar documentación del proyecto"
                maxlength="120"
                required
                autofocus
            >
            <p class="form-hint">Máximo 120 caracteres. Campo obligatorio.</p>
        </div>

        <div class="form-group">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea
                id="descripcion"
                name="descripcion"
                class="form-control"
                rows="4"
                placeholder="Descripción opcional de la tarea..."
            >{{ descripcion }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primario">Crear Tarea</button>
            <a href="{{ url_for('tareas.lista') }}" class="btn btn-secundario">Cancelar</a>
        </div>

    </form>
</div>
{% endblock %}
